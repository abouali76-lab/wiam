workflows:
  ios-simulator:
    name: iOS (simulator, unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter packages pub get
      - name: Build iOS for the Simulator (no code signing needed)
        script: |
          cd app
          flutter build ios --simulator --debug
    artifacts:
      - app/build/ios/iphonesimulator/*.app

  # Runs on a Mac machine (not Linux) on purpose: linux_x2/windows_x2 need
  # billing enabled on Codemagic, but mac_mini_m2 has free-tier minutes and
  # `flutter build apk` works identically on macOS — this avoids the
  # billing requirement entirely for a plain debug APK.
  android-debug:
    name: Android (debug APK)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter packages pub get
      - name: Build debug APK
        script: |
          cd app
          flutter build apk --debug
    artifacts:
      - app/build/app/outputs/**/*.apk
