workflows:
  ios-simulator:
    name: iOS (simulator, unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter packages pub get
      - name: Build iOS for the Simulator (no code signing needed)
        script: |
          cd app
          flutter build ios --simulator --debug
    artifacts:
      - app/build/ios/iphonesimulator/*.app

  android-debug:
    name: Android (debug APK)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter packages pub get
      - name: Build debug APK
        script: |
          cd app
          flutter build apk --debug
    artifacts:
      - app/build/app/outputs/**/*.apk
