<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
  :root{
    --bg-1: oklch(22% 0.05 258);
    --bg-2: oklch(15% 0.04 264);
    --ink: oklch(96% 0.01 90);
    --ink-muted: oklch(80% 0.03 260);
    --amber: oklch(80% 0.15 75);
    --amber-deep: oklch(64% 0.14 55);
    --teal: oklch(76% 0.10 195);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .wrap{
    font-family:'Tajawal', Tahoma, Arial, sans-serif;
    background:
      radial-gradient(circle at 22% 85%, oklch(34% 0.07 258 / .5), transparent 45%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color:var(--ink);
    position:relative;
    overflow:hidden;
  }
  .display{font-family:'Baloo Bhaijaan 2', Tahoma, Arial, sans-serif;}
  .top-bar{display:flex;align-items:center;justify-content:space-between;}
  .icon-btn{
    width:44px;height:44px;border-radius:14px;background:oklch(30% 0.05 260 / .7);
    display:flex;align-items:center;justify-content:center;border:1px solid oklch(45% 0.04 260 / .5);
  }
  .timer-chip{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:oklch(28% 0.05 260 / .85);border:1px solid oklch(45% 0.04 260 / .6);
    border-radius:22px;padding:10px 18px 12px;
    box-shadow:0 10px 26px oklch(8% 0.02 260 / .5);
  }
  .ring-wrap{position:relative;width:88px;height:88px;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .timer-num{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'Baloo Bhaijaan 2';font-size:22px;font-weight:700;letter-spacing:.5px;
  }
  .timer-label{font-size:12px;color:var(--ink-muted);}
  .game-zone{
    flex:1;border-radius:32px;border:2px dashed oklch(50% 0.04 260 / .55);
    background:oklch(24% 0.045 260 / .5);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  }
  .game-label{color:var(--ink-muted);font-size:16px;}
  .blob{border-radius:44% 56% 60% 40% / 50% 44% 56% 50%;filter:blur(2px);opacity:.5;}
</style>
</helmet>

<div class="wrap" dir="rtl" style="width:820px;height:1180px;padding:34px 40px;display:flex;flex-direction:column;gap:24px;">
  <div class="top-bar">
    <div class="icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21V13.6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V21"/><path d="M4 11.5 12 4l8 7.5"/></svg>
    </div>

    <div class="timer-chip">
      <div class="ring-wrap">
        <svg width="88" height="88" viewBox="0 0 88 88" fill="none">
          <circle cx="44" cy="44" r="38" stroke="oklch(42% 0.04 260)" stroke-width="7"/>
          <circle cx="44" cy="44" r="38" stroke="var(--amber)" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="238.7" stroke-dashoffset="66"/>
        </svg>
        <div class="timer-num">14:32</div>
      </div>
      <div class="timer-label">الوقت المتبقي</div>
    </div>

    <div class="icon-btn"><div style="width:16px;height:16px;"></div></div>
  </div>

  <div class="game-zone">
    <div style="width:120px;height:120px;background:linear-gradient(135deg, var(--teal), var(--amber));" class="blob"></div>
    <div class="game-label display" style="font-size:20px;">منطقة اللعب</div>
    <div class="game-label" style="font-size:14px;opacity:.8;">(محتوى اللعبة نفسه خارج نطاق هذا التصميم)</div>
  </div>
</div>
</x-dc>
</body>
</html>
