<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
  :root{
    --bg-1: oklch(20% 0.045 262);
    --bg-2: oklch(14% 0.035 266);
    --card: oklch(27% 0.05 260);
    --card-line: oklch(38% 0.05 260);
    --ink: oklch(96% 0.01 90);
    --ink-muted: oklch(78% 0.03 260);
    --amber: oklch(80% 0.15 75);
    --amber-deep: oklch(64% 0.14 55);
    --teal: oklch(76% 0.10 195);
    --planet-dim: oklch(46% 0.03 260);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .wrap{
    font-family:'Tajawal', Tahoma, Arial, sans-serif;
    background:
      radial-gradient(circle at 78% 12%, oklch(30% 0.06 262 / .55), transparent 40%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color:var(--ink);
    position:relative;
    overflow:hidden;
  }
  .star{position:absolute;border-radius:50%;background:var(--ink);opacity:.55;}
  .display{font-family:'Baloo Bhaijaan 2', Tahoma, Arial, sans-serif;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(155deg, var(--amber), var(--amber-deep));
    display:flex;align-items:center;justify-content:center;
  }
  .planet-zone{display:flex;flex-direction:column;align-items:center;gap:22px;}
  .planet{
    width:260px;height:260px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 34% 30%, oklch(58% 0.03 260), var(--planet-dim) 65%);
    box-shadow: inset -18px -18px 44px oklch(10% 0.02 260 / .55), 0 0 0 1px oklch(45% 0.03 260 / .4);
  }
  .ring{position:absolute;inset:-22px;border-radius:50%;border:2px dashed oklch(55% 0.04 260 / .55);}
  .lock-badge{
    position:absolute;left:8px;bottom:14px;width:64px;height:64px;border-radius:50%;
    background:linear-gradient(155deg, var(--amber), var(--amber-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px oklch(20% 0.05 60 / .45), 0 0 0 6px var(--bg-2);
  }
  .headline{font-size:34px;font-weight:700;text-align:center;line-height:1.35;max-width:520px;}
  .subtext{font-size:19px;color:var(--ink-muted);text-align:center;max-width:460px;line-height:1.6;}
  .card{
    width:560px;background:var(--card);border:1px solid var(--card-line);
    border-radius:24px;padding:22px 26px;display:flex;flex-direction:column;gap:16px;
  }
  .card-title{font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
  .card-title small{font-size:14px;font-weight:400;color:var(--ink-muted);}
  .task-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid oklch(40% 0.03 260 / .5);}
  .task-row:first-of-type{border-top:none;}
  .status-dot{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .status-dot.done{background:var(--amber);}
  .status-dot.pending{border:2px solid oklch(55% 0.03 260);}
  .task-label{flex:1;font-size:16px;font-weight:500;}
  .task-tag{font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .tag-auto{background:oklch(76% 0.10 195 / .18);color:var(--teal);}
  .tag-wait{background:oklch(70% 0.02 260 / .18);color:var(--ink-muted);}
  .progress-track{height:8px;border-radius:999px;background:oklch(40% 0.03 260 / .5);overflow:hidden;}
  .progress-fill{height:100%;width:33%;background:linear-gradient(90deg, var(--amber-deep), var(--amber));}
  .reward-pill{
    display:flex;align-items:center;gap:10px;padding:12px 24px;border-radius:999px;
    background:linear-gradient(120deg, var(--amber), var(--amber-deep));
    color:oklch(22% 0.05 60);font-weight:700;font-size:17px;
    box-shadow:0 10px 24px oklch(20% 0.05 60 / .35);
  }
</style>
</helmet>

<div class="wrap" dir="rtl" style="width:820px;height:1180px;padding:44px 50px;display:flex;flex-direction:column;align-items:center;">
  <div class="star" style="top:60px;left:120px;width:3px;height:3px;"></div>
  <div class="star" style="top:120px;left:640px;width:4px;height:4px;"></div>
  <div class="star" style="top:210px;left:90px;width:2px;height:2px;"></div>
  <div class="star" style="top:300px;left:700px;width:3px;height:3px;"></div>
  <div class="star" style="top:90px;left:400px;width:2px;height:2px;"></div>
  <div class="star" style="top:250px;left:520px;width:2px;height:2px;"></div>

  <div style="width:100%;display:flex;align-items:center;justify-content:space-between;">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2 L14.2 9.2 L21.5 9.5 L15.6 14 L17.8 21 L12 16.8 L6.2 21 L8.4 14 L2.5 9.5 L9.8 9.2 Z" fill="oklch(22% 0.05 60)"/></svg>
      </div>
      <div class="display" style="font-size:20px;font-weight:700;">وئام</div>
    </div>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding-top:10px;">
    <div class="planet-zone">
      <div class="planet">
        <div class="ring"></div>
        <div class="lock-badge">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(22% 0.05 60)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="9" rx="2.2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>
          </svg>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        <div class="headline display">كوكب الألعاب يستمد طاقته من إنجازاتك!</div>
        <div class="subtext">أكمل مهامك اليوم لتفتح بوابة اللعب</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">مهامك اليوم <small>أُنجز 1 من 3</small></div>

      <div class="task-row">
        <div class="status-dot done">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(22% 0.05 60)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
        </div>
        <div class="task-label">درس التفاعل الاجتماعي</div>
        <div class="task-tag tag-auto">تحقق تلقائي</div>
      </div>

      <div class="task-row">
        <div class="status-dot pending"></div>
        <div class="task-label">ترتيب الغرفة</div>
        <div class="task-tag tag-wait">بانتظار ولي الأمر</div>
      </div>

      <div class="task-row">
        <div class="status-dot pending"></div>
        <div class="task-label">حل الواجب المدرسي</div>
        <div class="task-tag tag-wait">بانتظار ولي الأمر</div>
      </div>

      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>

    <div class="reward-pill">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="oklch(22% 0.05 60)"><path d="M12 2 L14.7 8.9 L22 9.3 L16.3 13.8 L18.4 21 L12 16.7 L5.6 21 L7.7 13.8 L2 9.3 L9.3 8.9 Z"/></svg>
      20 دقيقة لعب بانتظارك
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
