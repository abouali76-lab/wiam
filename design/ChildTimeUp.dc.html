<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
  :root{
    --bg-1: oklch(17% 0.035 264);
    --bg-2: oklch(12% 0.03 266);
    --ink: oklch(96% 0.01 90);
    --ink-muted: oklch(74% 0.03 260);
    --amber: oklch(80% 0.15 75);
    --amber-deep: oklch(64% 0.14 55);
    --teal: oklch(76% 0.10 195);
    --teal-deep: oklch(60% 0.10 195);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .wrap{
    font-family:'Tajawal', Tahoma, Arial, sans-serif;
    background:linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color:var(--ink);
    position:relative;overflow:hidden;
  }
  .display{font-family:'Baloo Bhaijaan 2', Tahoma, Arial, sans-serif;}
  .star{position:absolute;border-radius:50%;background:var(--ink);opacity:.4;}
  .mascot{width:180px;height:180px;position:relative;}
  .headline{font-size:32px;font-weight:700;text-align:center;line-height:1.35;max-width:520px;}
  .subtext{font-size:19px;color:var(--ink-muted);text-align:center;max-width:440px;line-height:1.6;}
  .chip{
    display:flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;
    background:oklch(28% 0.04 260 / .8);border:1px solid oklch(42% 0.04 260 / .6);
    font-size:14px;color:var(--ink-muted);
  }
  .btn{
    padding:16px 54px;border-radius:20px;background:linear-gradient(120deg, var(--teal), var(--teal-deep));
    color:oklch(16% 0.03 264);font-weight:700;font-size:18px;
    box-shadow:0 12px 26px oklch(8% 0.03 200 / .5);
  }
</style>
</helmet>

<div class="wrap" dir="rtl" style="width:820px;height:1180px;padding:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;">
  <div class="star" style="top:80px;left:150px;width:3px;height:3px;"></div>
  <div class="star" style="top:140px;left:650px;width:2px;height:2px;"></div>
  <div class="star" style="top:230px;left:110px;width:2px;height:2px;"></div>
  <div class="star" style="top:300px;left:690px;width:3px;height:3px;"></div>

  <svg width="30" height="30" viewBox="0 0 24 24" fill="var(--ink-muted)" style="position:absolute;top:70px;right:90px;opacity:.7;">
    <path d="M14.5 2.5a9.5 9.5 0 1 0 7 15.9 8 8 0 0 1-7-15.9Z"/>
  </svg>

  <div class="mascot">
    <svg width="180" height="180" viewBox="0 0 180 180" fill="none">
      <path d="M90 12 L106 66 L164 70 L118 104 L134 160 L90 126 L46 160 L62 104 L16 70 L74 66 Z"
        fill="oklch(40% 0.03 260)" stroke="oklch(52% 0.03 260)" stroke-width="2"/>
      <path d="M66 96q5 -9 14 0" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M100 96q5 -9 14 0" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M84 116q6 6 12 0" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" fill="none"/>
    </svg>
    <div style="position:absolute;top:6px;left:28px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
      <div style="width:8px;height:8px;border-radius:50%;background:var(--ink-muted);opacity:.7;"></div>
      <div style="width:11px;height:11px;border-radius:50%;background:var(--ink-muted);opacity:.55;margin-right:10px;"></div>
      <div style="width:14px;height:14px;border-radius:50%;background:var(--ink-muted);opacity:.4;margin-right:18px;"></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div class="headline display">لقد نفدت طاقة الكوكب اليوم!</div>
    <div class="subtext">نراك غداً بعد إنجاز مهامك الجديدة</div>
  </div>

  <div class="chip">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
    تم حفظ تقدمك بأمان
  </div>

  <div class="btn display">حسناً، إلى الغد!</div>
</div>
</x-dc>
</body>
</html>
